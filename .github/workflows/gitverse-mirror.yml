name: Mirror to GitVerse

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
      GITVERSE_REPO: https://gitverse.ru/yasg1988/araltysh.git
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror to GitVerse
        shell: bash
        run: |
          if [ -z "$GITVERSE_TOKEN" ]; then
            echo "GITVERSE_TOKEN is not configured. Skipping GitVerse mirror."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add gitverse "https://${GITVERSE_TOKEN}@gitverse.ru/yasg1988/araltysh.git"
          git push --mirror gitverse
